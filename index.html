<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLOTH212 的个人主页</title>
  <style>
    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      color: #172033;
      font: 1rem/1.6 system-ui, "Microsoft YaHei", sans-serif;
    }
    main {
      box-sizing: border-box;
      width: min(100%, 38rem);
      padding: clamp(1.5rem, 7vw, 3.5rem);
      background: #fff;
      border: 1px solid #dbe4ee;
      border-radius: 1.25rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      line-height: 1.2;
    }
    a {
      color: #1b4eb4;
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <main>
    <h1>你好，我是 SLOTH212</h1>
    <a href="https://github.com/SLOTH212">查看我的 GitHub 资料</a>
  </main>
</body>
</html>
